
spring:
  application:
    name: user-login-app

  datasource:
    url: jdbc:postgresql://localhost:5432/user_login
    username: ${DB_USERNAME:[your_database_username]}
    password: ${DB_PASSWORD:[your_password]}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
